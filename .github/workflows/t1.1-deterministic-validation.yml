name: T1.1 deterministic validation

on:
  push:
    branches:
      - owner/t1.1-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact patch artifact
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 1e89c4f7d7d1e32b6b14f795d4d36ed02896c14b

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install base-action dependencies
        working-directory: base-action
        run: bun install --frozen-lockfile

      - name: Run WIF regression tests
        working-directory: base-action
        run: bun test test/workload-identity.test.ts test/wif-credential-precedence.test.ts

      - name: Typecheck base action
        working-directory: base-action
        run: bun run typecheck

      - name: Check formatting of changed files
        working-directory: base-action
        run: bunx prettier --check src/workload-identity.ts test/wif-credential-precedence.test.ts
